{% extends "base.html" %}

{% block title %}
MeadBook
{% endblock %}

{% block content %}

<div class='d-flex justify-content-between align-items-center mb-3'>

    <h2 class='mb-0'>
        Партии
    </h2>

    <a
        href="{% url 'batch_create' %}"
        class='btn btn-primary'>

        + Новая партия

    </a>

</div>

{% for batch in batches %}

<div>

    <h3>{{ batch.name }}</h3>

    {{ batch.brew_date }}

</div>

{% empty %}

Пока ничего нет.

{% endfor %}


{% endblock %}
