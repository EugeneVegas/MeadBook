{% load static %}
<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>

    <title>{{ batch.name }}</title>

    <style>
        @page {
            size: 40mm 60mm;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 40mm;
            height: 60mm;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 9pt;
        }

        .label {
            width: 40mm;
            height: 60mm;
            padding: 2mm;

            display: flex;
            flex-direction: column;

            border: 1px solid #000;
            border-radius: 10px;
        }

        .title {
            text-align: center;
            font-size: 12pt;
            font-weight: bold;
            margin-bottom: 2mm;
        }

        .subtitle {
            text-align: center;
            font-size: 8pt;
            color: #666;
            margin-bottom: 3mm;
        }

        .section {
            margin-bottom: 1mm;
        }

        .label-name {
            font-size: 6pt;
            color: #777;
            text-transform: uppercase;
        }

        .value {
            font-size: 9pt;
            font-weight: bold;
        }

        .status {
            text-align: center;
            font-size: 9pt;
            font-weight: bold;

            border: 1px solid #000;
            padding: 1mm;

            margin: 2mm 0;
        }

        .qr {
            text-align: center;
        }

        .qr img {
            width: 18mm;
            height: 18mm;
        }

        .footer {
            text-align: center;
            font-size: 6pt;
            color: #888;
        }
    </style>

</head>

<body>

<div class='label'>
    
    <div class='title'>
        {{ batch.name }}
    </div>

    <div class='section'>
        <div class='label-name'>
            Batch
        </div>

        <div class='value'>
            #{{ batch.pk }}
        </div>
    </div>

    <div class='section'>
        <div class='label-name'>
            Brew date
        </div>

        <div class='value'>
            {{ batch.brew_date|date:'d.m.Y' }}
        </div>
    </div>

    <div class='section'>
        <div class='label-name'>
            Volume
        </div>

        <div class='value'>
            {{ batch.volume }} L
        </div>
    </div>

    <div class='section'>
        <div class='label-name'>
            Original Gravity
        </div>

        <div class='value'>
            {{ batch.original_gravity|default:'--' }}
        </div>
    </div>
    <div class='qr'>
        {% if qr_code %}
            <img src='{{ qr_code }}'
                 alt='QR'>
        {% else %}
            <div style='
                width:20mm;
                height:20mm;
                border:1px dashed #888;
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:8pt;
                color:#888;'>
                QR
            </div>
        {% endif %}
    </div>
    <div class='footer'>
        Scan for fermentation log
    </div>
</div>
</body>
</html>
