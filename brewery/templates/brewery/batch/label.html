{% load static %}

<!DOCTYPE html>

<html lang='en'>

<head>
    <meta charset='UTF-8'>


<title>{{ batch.name }}</title>

<style>
    @page {
        size: 58mm 40mm;
        margin: 0;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 58mm;
        height: 40mm;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9pt;
    }

    .label {
        width: 58mm;
        height: 40mm;
        padding: 2mm;

        display: grid;
        grid-template-columns: 1fr 2fr;
        grid-template-rows: auto 1fr auto;
        gap: 1mm;

        border: 1px dotted #000;
        border-radius: 10px;
    }

    .title {
        grid-column: 1 / -1;

        font-size: 12pt;
        font-weight: bold;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 0;
    }

    .section {
        //border-bottom: 1px solid #000;
        padding: 1mm 0;
    }

    .section:last-child {
        border-bottom: none;
    }

    .label-name {
        font-size: 6pt;
        color: #777;
        text-transform: uppercase;
    }

    .value {
        font-size: 9pt;
        font-weight: bold;
    }

    .qr {
        grid-column: 2;
        grid-row: 2;

        display: flex;
        justify-content: right;
        align-items: center;
    }

    .qr img {
        width: 25mm;
        height: 25mm;
    }

    .qr-placeholder {
        width: 28mm;
        height: 28mm;

        border: 1px dashed #888;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 8pt;
        color: #888;
    }

    .footer {
        grid-column: 1 / -1;

        border-top: 1px solid #000;

        padding-top: 1mm;

        text-align: center;
        font-size: 6pt;
        color: #888;
    }
</style>

</head>

<body>

<div class='label'>
<div class='title'>
    {{ batch.name }}
</div>

<div class='info'>
    
    <div class='section'>
        <div class='label-name'>
            Batch
        </div>

        <div class='value'>
            #{{ batch.pk }}
        </div>
    </div>

    <div class='section'>
        <div class='label-name'>
            Date
        </div>

        <div class='value'>
            {{ batch.brew_date|date:'d.m.Y' }}
        </div>
    </div>

    <div class='section'>
        <div class='label-name'>
            OG
        </div>

        <div class='value'>
            {{ batch.original_gravity|default:'--' }}
        </div>
    </div>

</div>

<div class='qr'>
    {% if qr_code %}
        <img src='{{ qr_code }}'
             alt='QR'>
    {% else %}
        <div class='qr-placeholder'>
            QR
        </div>
    {% endif %}
</div>

<div class='footer'>
    Scan for fermentation log
</div>

</div>

</body>
</html>
