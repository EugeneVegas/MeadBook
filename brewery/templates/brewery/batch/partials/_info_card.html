<div class='col-lg-8'>
    <div class='card h-100'>
        <div class='card-header'>Batch Information</div>
        <div class='card-body'>
            <div class='mb-3'>
                <div class='text-muted small'>
                    Brew date
                </div>
                <div class='fw-semibold'>
                    {{ batch.brew_date }}
                </div>
            </div>
            <div class='mb-3'>
                <div class='text-muted small'>
                    Volume
                </div>
                <div class='fw-semibold'>
                    {{ batch.volume }} L
                </div>
            </div>
            <div class='mb-3'>
                <div class='text-muted small'>
                    Recipe
                </div>
                <div>
                    {{ batch.recipe|linebreaks }}
                </div>
            </div>
            <div class='mb-3'>
                <div class='text-muted small'>
                    Notes
                </div>
                <div>
                    {{ batch.notes|linebreaks }}
                </div>
            </div>
        </div>
    </div>
</div>
