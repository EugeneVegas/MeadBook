<div class='col-12'>
    <div class='card'>
        <div class='card-header'>
            <div class='d-flex justify-content-between align-items-center'>
                <h3 class='mb-0'>
                    🍯 {{ batch.name }}
                </h3>
                <div class='d-flex gap-2'>
                    <a href="{% url 'batch_update' batch.pk %}" class='btn btn-sm btn-outline-secondary'>
                        Edit
                    </a>

                    <a href="{% url 'batch_list' %}" class='btn btn-sm btn-outline-primary'>
                        Back
                    </a>
                </div>
            </div>
        </div>

        <div class='card-body'>
            Created {{ batch.created_at|date:'d.m.Y H:i' }}
        </div>
    </div>
</div>
